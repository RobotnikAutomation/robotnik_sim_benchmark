# Compact benchmark matrix.  The loader expands it into the historical
# simulator -> category mapping consumed by run_benchmark.py.
benchmark:
  robot_model: rbwatcher
  robot_counts: [1, 2, 3]
  worlds:
    empty:
      gazebo_harmonic: empty
      webots: empty
      isaac_sim: empty_world.usd
      unity: empty_world
      o3de: EmptyLevel
      mujoco: empty
    simple:
      gazebo_harmonic: demo
      webots: demo
      isaac_sim: simple_world.usd
      unity: simple_world
      o3de: BasicLevel
      mujoco: simple
  modes:
    gui: {headless: false}
    headless: {headless: true}
  rviz: [false, true]

simulators:
  gazebo_harmonic:
    backend:
      strategy: world_and_multiple
      launch_package: robotnik_gazebo_ignition
      world_launch: spawn_world.launch.py
      world_arguments: ["world:={world}", "gui:={gui}"]
      multiple_script: scripts/multiple.sh
      multiple_arguments:
        - "{robot_count}"
        - "{robot_model}"
        - "1.0"
        - "1.0"
        - "0.0"
        - "0.0"
        - "0.05"
        - "0.0"
        - "--"
        - run_rviz:=false

  webots:
    backend:
      strategy: world_and_multiple
      launch_package: robotnik_webots
      world_launch: spawn_world.launch.py
      world_arguments: ["world:={world}", "gui:={gui}"]
      multiple_script: scripts/multiple.sh
      multiple_arguments:
        - "{robot_count}"
        - "{robot_model}"
        - "1.0"
        - "1.0"
        - "0.0"
        - "0.0"
        - "0.05"
        - "0.0"
        - "--"
        - run_rviz:=false

  o3de:
    backend:
      strategy: world_and_multiple
      launch_package: robotnik_o3de
      world_launch: spawn_world.launch.py
      world_arguments: ["world:={world}", "gui:={gui}"]
      multiple_script: scripts/multiple.sh
      multiple_arguments:
        - "{robot_count}"
        - "{robot_model}"
        - "1.0"
        - "1.0"
        - "0.0"
        - "0.0"
        - "0.05"
        - "0.0"
        - "--"
        - run_rviz:=false

  mujoco:
    backend:
      strategy: launch
      launch_package: robotnik_mujoco
      launch_file: rbwatcher_benchmark.launch.py
      launch_arguments:
        - world:={world}
        - num_robots:={robot_count}
        - run_rviz:=false
        - gui:={gui}
        - render_fps:={render_fps}

  isaac_sim:
    backend:
      strategy: launch
      launch_package: isaac_sim
      launch_file: isaac_sim_complete.launch.py
      launch_arguments:
        - num_robots:={robot_count}
        - world_file:={world}
        - run_rviz:=false
        - headless:={headless}

  unity:
    backend:
      strategy: launch
      launch_package: unity_sim
      launch_file: unity_complete.launch.py
      launch_arguments:
        - headless:={headless}
        - robot_count:={robot_count}
        - world:={world}
        - run_rviz:=false
        - render_fps:={render_fps}
        - robot_transport:=per_robot_transport
